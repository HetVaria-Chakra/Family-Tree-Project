<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Family Tree Project</h1>
            <p>Build and visualize your family tree</p>
        </header>

        <div class="controls">
            <button id="addMemberBtn" class="btn btn-primary">Add Family Member</button>
            <button id="exportBtn" class="btn btn-secondary">Export Data</button>
            <button id="importBtn" class="btn btn-secondary">Import Data</button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>

        <div class="family-tree-container">
            <div id="familyTree" class="family-tree">
                <!-- Family tree will be dynamically generated here -->
            </div>
        </div>

        <!-- Add Member Modal -->
        <div id="addMemberModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Add Family Member</h2>
                <form id="addMemberForm">
                    <div class="form-group">
                        <label for="memberName">Name:</label>
                        <input type="text" id="memberName" required>
                    </div>
                    <div class="form-group">
                        <label for="memberBirthDate">Birth Date:</label>
                        <input type="date" id="memberBirthDate">
                    </div>
                    <div class="form-group">
                        <label for="memberGender">Gender:</label>
                        <select id="memberGender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="memberParent">Parent:</label>
                        <select id="memberParent">
                            <option value="">None (Root)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="memberSpouse">Spouse:</label>
                        <select id="memberSpouse">
                            <option value="">None</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Add Member</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
